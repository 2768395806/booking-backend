# ===== 服务端口 =====
server.port=8993

# ===== SQLite 数据源 =====
# 默认 data/booking.db（相对工作目录）；云端部署可用环境变量 BOOKING_DB_URL 指向挂载盘，如 jdbc:sqlite:/mnt/data/booking.db
spring.datasource.url=${BOOKING_DB_URL:jdbc:sqlite:data/booking.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ===== MyBatis-Plus =====
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 通用 =====
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ===== 文件上传 =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== 微信小程序（微信登录） =====
# secret 从环境变量 WECHAT_SECRET 注入（避免密钥写入代码仓库）；本地可 export WECHAT_SECRET=你的值
wechat.appid=wxa27b064a76fbcfdc
wechat.secret=${WECHAT_SECRET:}
